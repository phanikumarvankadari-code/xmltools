<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XMLTools - Comprehensive XML Toolkit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header>
      <h1>🧰 XMLTools</h1>
      <p>Comprehensive XML Toolkit</p>
    </header>

    <!-- Toolbar -->
    <div class="toolbar">
      <button id="openBtn" class="btn">📂 Open</button>
      <button id="saveBtn" class="btn">💾 Save</button>
      <button id="clearBtn" class="btn">🗑️ Clear</button>
      <span class="spacer"></span>
      <span class="status" id="status">Ready</span>
    </div>

    <!-- Tab Navigation -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="lint">Lint</button>
      <button class="tab-btn" data-tab="format">Format</button>
      <button class="tab-btn" data-tab="tree">Tree</button>
      <button class="tab-btn" data-tab="xpath">XPath</button>
      <button class="tab-btn" data-tab="schema">Schema</button>
      <button class="tab-btn" data-tab="xslt">XSLT</button>
      <button class="tab-btn" data-tab="xml-json">XML↔JSON</button>
      <button class="tab-btn" data-tab="diff">Diff</button>
      <button class="tab-btn" data-tab="xsd-gen">Gen XSD</button>
      <button class="tab-btn" data-tab="grid">Grid</button>
    </div>

    <!-- Main Content Area -->
    <div class="content">
      <!-- Lint Tab -->
      <div class="tab-content active" id="lint-tab">
        <div class="toolbar">
          <button class="btn-small" onclick="runLint()">▶ Run Lint</button>
        </div>
        <div class="pane-vertical">
          <div class="pane">
            <label>XML Input:</label>
            <textarea id="lint-input" placeholder="Paste XML here..."></textarea>
          </div>
          <div class="pane">
            <label>Errors:</label>
            <div id="lint-errors" class="error-panel"></div>
          </div>
        </div>
      </div>

      <!-- Format Tab -->
      <div class="tab-content" id="format-tab">
        <div class="toolbar">
          <button class="btn-small" onclick="runFormat()">▶ Format</button>
          <button class="btn-small" onclick="copyFormatOutput()">📋 Copy</button>
          <button class="btn-small" onclick="saveFormatOutput()">💾 Save</button>
        </div>
        <div class="pane-horizontal">
          <div class="pane">
            <label>Input:</label>
            <textarea id="format-input" placeholder="Paste XML here..."></textarea>
          </div>
          <div class="pane">
            <label>Output:</label>
            <textarea id="format-output" readonly placeholder="Formatted output..."></textarea>
          </div>
        </div>
      </div>

      <!-- Tree Tab -->
      <div class="tab-content" id="tree-tab">
        <div class="toolbar">
          <button class="btn-small" onclick="openTreeFile()">📂 Open File</button>
          <button class="btn-small" onclick="expandTree()">➕ Expand All</button>
          <button class="btn-small" onclick="collapseTree()">➖ Collapse All</button>
          <span class="spacer"></span>
          <span id="tree-hint" style="font-size: 0.85em; color: #666;">Right-click to edit • Drag files to load</span>
        </div>
        <div class="pane-horizontal">
          <div class="pane">
            <label>Structure:</label>
            <div id="tree-view" class="tree-view" style="border: 2px dashed #ccc; min-height: 300px; padding: 10px;"></div>
          </div>
          <div class="pane">
            <label>Details / Edit:</label>
            <div id="tree-details" class="tree-details" style="overflow-y: auto;"></div>
          </div>
        </div>
        <input type="file" id="tree-file" accept=".xml" style="display:none">
      </div>

      <!-- Context Menu (hidden by default) -->
      <div id="context-menu" style="display:none; position:fixed; background:#fff; border:1px solid #ccc; border-radius:4px; box-shadow:0 2px 8px rgba(0,0,0,0.15); z-index:10000;">
        <div id="context-menu-items"></div>
      </div>

      <!-- XPath Tab -->
      <div class="tab-content" id="xpath-tab">
        <div class="toolbar">
          <input type="text" id="xpath-query" placeholder="Enter XPath expression..." class="input-field">
          <button class="btn-small" onclick="runXPath()">▶ Query</button>
        </div>
        <div class="pane-vertical">
          <div class="pane">
            <label>XML:</label>
            <textarea id="xpath-input" placeholder="Paste XML here..."></textarea>
          </div>
          <div class="pane">
            <label>Results:</label>
            <div id="xpath-results" class="results-panel"></div>
          </div>
        </div>
      </div>

      <!-- Schema Validation Tab -->
      <div class="tab-content" id="schema-tab">
        <div class="toolbar">
          <button class="btn-small" onclick="loadSchema()">📂 Load Schema</button>
          <button class="btn-small" onclick="runValidation()">✓ Validate</button>
        </div>
        <div class="pane-horizontal">
          <div class="pane">
            <label>XML:</label>
            <textarea id="schema-input" placeholder="Paste XML here..."></textarea>
          </div>
          <div class="pane">
            <label>Validation:</label>
            <div id="schema-results" class="error-panel"></div>
            <input type="file" id="schema-file" accept=".xsd,.dtd" style="display:none">
          </div>
        </div>
      </div>

      <!-- XSLT Transform Tab -->
      <div class="tab-content" id="xslt-tab">
        <div class="toolbar">
          <button class="btn-small" onclick="loadXsltXml()">📂 Load XML</button>
          <button class="btn-small" onclick="loadXSL()">📂 Load XSL</button>
          <button class="btn-small" onclick="runTransform()">▶ Transform</button>
          <button class="btn-small" onclick="copyXSLTOutput()">📋 Copy</button>
          <button class="btn-small" onclick="viewXsltOutputInGrid()">🔲 View in Grid</button>
        </div>
        <div class="pane-triple">
          <div class="pane">
            <label>XML:</label>
            <textarea id="xslt-xml" placeholder="Paste XML here..."></textarea>
          </div>
          <div class="pane">
            <label>XSL:</label>
            <textarea id="xslt-xsl" readonly placeholder="Load XSL..."></textarea>
          </div>
          <div class="pane">
            <label>Output:</label>
            <textarea id="xslt-output" readonly placeholder="Transform output..."></textarea>
          </div>
        </div>
        <input type="file" id="xslt-file" accept=".xsl,.xslt" style="display:none">
        <input type="file" id="xslt-xml-file" accept=".xml" style="display:none">
      </div>

      <!-- XML↔JSON Tab -->
      <div class="tab-content" id="xml-json-tab">
        <div class="toolbar">
          <button class="btn-small" onclick="xmlToJson()">→ XML to JSON</button>
          <button class="btn-small" onclick="jsonToXml()">← JSON to XML</button>
          <button class="btn-small" onclick="copyLeft()">📋 Copy Left</button>
          <button class="btn-small" onclick="copyRight()">📋 Copy Right</button>
        </div>
        <div class="pane-horizontal">
          <div class="pane">
            <label>XML:</label>
            <textarea id="xml-input" placeholder="Paste XML here..."></textarea>
          </div>
          <div class="pane">
            <label>JSON:</label>
            <textarea id="json-input" placeholder="Paste JSON here..."></textarea>
          </div>
        </div>
      </div>

      <!-- Diff Compare Tab -->
      <div class="tab-content" id="diff-tab">
        <div class="toolbar">
          <button class="btn-small" onclick="loadFileA()">📂 File A</button>
          <button class="btn-small" onclick="loadFileB()">📂 File B</button>
          <button class="btn-small" onclick="runDiff()">⚖️ Compare</button>
          <button class="btn-small" onclick="exportDiff()">💾 Export</button>
        </div>
        <div id="diff-summary" class="summary"></div>
        <div class="pane-horizontal">
          <div class="pane">
            <label>File A:</label>
            <textarea id="diff-a" placeholder="Load file A..."></textarea>
          </div>
          <div class="pane">
            <label>File B:</label>
            <textarea id="diff-b" placeholder="Load file B..."></textarea>
          </div>
        </div>
        <input type="file" id="file-a" accept=".xml" style="display:none">
        <input type="file" id="file-b" accept=".xml" style="display:none">
      </div>

      <!-- XSD Generation Tab -->
      <div class="tab-content" id="xsd-gen-tab">
        <div class="toolbar">
          <button class="btn-small" onclick="generateXSD()">▶ Generate XSD</button>
          <button class="btn-small" onclick="saveXSD()">💾 Save XSD</button>
        </div>
        <div class="pane-vertical">
          <div class="pane">
            <label>Sample XML:</label>
            <textarea id="xsd-input" placeholder="Paste sample XML here..."></textarea>
          </div>
          <div class="pane">
            <label>Generated XSD:</label>
            <textarea id="xsd-output" readonly placeholder="Generated XSD..."></textarea>
          </div>
        </div>
      </div>

      <!-- Grid Tab -->
      <div class="tab-content" id="grid-tab">
        <div class="toolbar">
          <button class="btn-small" onclick="loadGrid()">▶ Load Grid</button>
          <button class="btn-small" onclick="loadGridXmlFile()">📂 Load XML</button>
          <button class="btn-small" onclick="toggleGridPaste()">📝 Paste XML</button>
          <button class="btn-small" onclick="gridFromXsltOutput()">📥 From XSLT Output</button>
          <button class="btn-small" onclick="expandGrid()">➕ Expand All</button>
          <button class="btn-small" onclick="collapseGrid()">➖ Collapse All</button>
          <span class="spacer"></span>
          <button class="btn-small" id="grid-mode-grid" onclick="setGridMode('grid')">Grid</button>
          <button class="btn-small" id="grid-mode-paths" onclick="setGridMode('paths')">Paths</button>
        </div>
        <div id="grid-paste-wrap" class="grid-paste-wrap" style="display:none">
          <div class="grid-paste-head">
            <label for="grid-paste">Paste XML:</label>
            <span class="spacer"></span>
            <button class="btn-small" onclick="renderPastedXml()">▶ Render</button>
            <button class="btn-small" onclick="clearGridPaste()">🗑️ Clear</button>
          </div>
          <textarea id="grid-paste" class="grid-paste" placeholder="Paste XML here, then click ▶ Render..."></textarea>
        </div>
        <div id="grid-view" class="grid-view"></div>
        <input type="file" id="grid-xml-file" accept=".xml,.xsd,.xsl,.xslt" style="display:none">
      </div>
    </div>

    <!-- Status Bar -->
    <footer class="statusbar">
      <span id="statusbar">Ready</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
